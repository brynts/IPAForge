name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Prefer a specific version if available, fallback to default
          sudo xcode-select -s /Applications/Xcode_26.3.0.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build (unsigned)
        run: |
          # TODO: adjust scheme/project name after Xcode project is created
          xcodebuild \
            -project IPAForge.xcodeproj \
            -scheme IPAForge \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" | head -n 1)
          echo "Found app: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r IPAForge.ipa Payload
          mkdir -p upload
          mv IPAForge.ipa upload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPAForge
          path: upload/*

      - name: Create Draft Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
