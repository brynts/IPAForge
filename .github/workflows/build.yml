name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.0.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_26.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Resolve packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project IPAForge.xcodeproj \
            -scheme IPAForge \
            -derivedDataPath build
          echo "--- Package.resolved ---"
          find . -name Package.resolved -print -exec cat {} \; || true

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project IPAForge.xcodeproj \
            -scheme IPAForge \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build -name "IPAForge.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "IPAForge.app not found"
            find build -type d -name "*.app" || true
            exit 1
          fi
          echo "Found: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr IPAForge.ipa Payload
          mkdir -p upload
          mv IPAForge.ipa upload/
          ls -lh upload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPAForge
          path: upload/*

      - name: Create Draft Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
